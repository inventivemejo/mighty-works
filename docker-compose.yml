services:
  mysql:
    image: mysql:8.4
    container_name: mightyworks-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: mightyworks
      MYSQL_USER: mightyworks
      MYSQL_PASSWORD: mightyworks_secret
    volumes:
      - mightyworks_mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot_secret"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mightyworks_mysql_data:
